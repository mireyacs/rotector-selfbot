# rotector-selfbot configuration.
#
# Copy to config.toml (same directory) or to
# ~/.config/rotector-selfbot/config.toml.
#
# config.toml is gitignored. Treat the token like a password: anyone holding it
# has full control of the account.
#
# Upgrading from an older version? Add any newly introduced settings with:
#
#     python -m rsb migrate            # apply
#     python -m rsb migrate --dry-run  # just show what is missing
#
# It only appends what is absent -- your values and comments are left alone,
# and the previous file is kept as config.toml.bak.


# Your Discord credentials. DISCORD_TOKEN / DISCORD_BOT_TOKEN override these.
[discord]
# Your user token. Treat this like a password.
token = ""

# Optional bot application token, used ONLY when no user token is set above --
# a user account can do strictly more, so it always wins.
#
# A bot reaches only servers it has been invited to: no friends, no DMs, no
# group DMs. In exchange it can list EVERY member of those servers, offline
# included, without needing kick/ban/manage-roles -- which a user account
# cannot. Requires SERVER MEMBERS INTENT to be enabled for the application at
# https://discord.com/developers/applications -> Bot -> Privileged Gateway
# Intents, or Discord refuses the connection with close code 4014.
bot_token = ""


# Rotector API access. ROTECTOR_API_KEY overrides api_key.
[rotector]
# Optional. Raises your limit on one connection.
api_key = ""

# Documented standard tier: 50 per window.
rate_limit = 50

# Rate limit window, in seconds.
window = 10.0

# Request units held back as safety headroom.
reserve = 5

# In-memory cache lifetime, clamped under 24h.
cache_ttl = 3600

# Concurrent in-flight requests.
concurrency = 3


# The Okappiki backend, used only when scan.backend is "okappiki".
# Undocumented upstream: no published rate limit, and no batch endpoint, so one
# request covers one member. A 10,000-member server is 10,000 requests, where
# Rotector checks the same list a hundred ids at a time. The defaults are slow
# on purpose; raise them only if you learn what the real ceiling is.
[okappiki]
# Requests per window. 5/second by default.
rate_limit = 5

# Rate limit window, in seconds.
window = 1.0

# Request units held back as safety headroom.
reserve = 0

# In-memory cache lifetime, clamped under 24h.
cache_ttl = 3600

# Concurrent in-flight requests.
concurrency = 2


# Pulling new commits into the clone this runs from. Needs git on
# PATH. Checking is a read; applying always asks first, in a dialog
# listing the commits. A working copy with uncommitted changes is
# never touched.
[update]
# Look for new commits shortly after startup. Ctrl+U checks on demand.
check_on_start = true


# Music for long scans, streamed from https://github.com/mireyacs/openlofi.
# Nothing is downloaded into this clone: it is a separate repository precisely
# so that cloning this one never pulls half a gigabyte of audio. Needs ffplay,
# which ships with FFmpeg.
[vibe]
# Start vibe mode with the app. 'v' toggles it either way.
enabled = false

# owner/name of the repo holding the library, and the branch within it.
repo = "mireyacs/openlofi"
branch = "main"

# 0-100, handed straight to ffplay.
volume = 60

# Play the library in a random order.
shuffle = true

# Play while a scan runs, and stop when it finishes.
follow_scans = false


# Appearance. Set from inside the app rather than by hand.
[ui]
# Textual theme to open in, remembered when you pick one from the command
# palette's Theme command. Empty means the default. "ten-thousand" matches the
# project page.
theme = ""

# Layout, remembered as you change it. Written by the app, not by hand.
pane_width = 0        # sources pane width; 0 = the default
detail_height = 0     # detail pane height; 0 = the default
sources_hidden = false
detail_hidden = false
collapsed = []        # source groups left folded


# What a scan collects and what the results table lists.
[scan]
# Which service answers "is this member flagged": "rotector" or "okappiki".
# They are alternatives, not layers. Okappiki returns Okappiki, Rotector and
# mococo findings in one response, but one member per request.
backend = "rotector"

# How many queued scans may run at once. They share one rate limiter per
# backend -- Rotector's terms forbid getting around the window, so a second
# scan does not buy throughput, it splits it.
max_concurrent_jobs = 2

# Bots have no Roblox connections.
skip_bots = true

# Cap members per source. 0 = no cap.
max_members = 0

# Hide members Rotector has not flagged.
hide_no_detections = true

# Hide members with no Rotector-known Roblox account.
hide_unknown = true

# What a new scan does with results already on screen:
# "ask", "replace", "merge_skip" or "merge_recheck".
# Merging accumulates coverage across runs, because an
# unprivileged scan only ever sees who was online.
on_rescan = "ask"


# Routing Rotector lookups over proxies.
# Rotector's Terms of Use prohibit circumventing rate limits by
# rotating IPs. An API key is the sanctioned way to go faster.
[proxy]
# Off by default. Enabling it is your call.
enabled = false

# Newline-delimited proxy list.
file = "proxies.txt"

# Extra proxies inline.
list = []

# false = your connection is a co-equal route and carries work.
direct_as_fallback = false

# Failures before a route is marked unhealthy.
max_failures = 3

# Per-request timeout for proxied calls.
timeout = 20.0

# Concurrent probes while testing.
probe_concurrency = 10


# Defaults for the export dialog. Saved here when you tick 'Remember'.
[export]
# Any of "csv", "txt", "json", "png", "html".
# "png" draws the table as an image and needs Pillow;
# "html" writes one searchable page with both views.
formats = ["csv", "txt"]

# "filtered" honours the results filter; "all" exports everything.
scope = "filtered"

# Rows per CSV segment. 0 = one file.
segment_size = 1000

# Columns to write. Empty = the default set.
columns = []

# Parent folder for exports.
directory = "exports"

# "table" draws the results grid; "cards" draws a
# Discord-style profile per member, with avatar and banner.
png_style = "table"

# Draw exports in the app's current theme instead of the fixed dark one.
# Chrome only -- verdict colours stay put, because the accent on a
# THREAT row is the finding rather than decoration.
follow_theme = false

# Keep exports past the 24h retention window.
# Off means old export folders are cleared automatically --
# Rotector's terms forbid retaining their data that long.
preserve = false


# Deleting your own messages from a conversation with a flagged
# account. Only ever your own -- Discord gives no way to remove
# someone else's messages from a DM.
[purge]
# Seconds between deletions. Discord's delete limit is strict;
# lowering this mostly buys you 429s and a slower purge.
delete_delay = 1.0

# Cap on messages collected. 0 = no cap.
max_messages = 0

# Only history this recent. 0 = all of it.
max_age_days = 0


# Acting on members from the results table.
# Your own appeal route, offered alongside Rotector's -- never instead of it.
# Rotector's terms require that anyone actioned on their data can appeal to
# Rotector, so this is always added to that link, not substituted for it.
#
# Useful when Rotector's own queue is not the right place: their backlog, or a
# CAUTION finding you applied your own judgement to.
[appeal]
# Invite to a server where appeals are handled.
invite = ""

# An email, moderator handle or form URL.
contact = ""

# An extra line, e.g. "Include your Roblox username".
note = ""

# Also mention it in the audit-log reason. Only if it fits: Discord caps
# reasons at 512 characters and the Rotector link is never what gets trimmed.
include_in_reason = false


[moderation]
# Only Flagged/Confirmed may be kicked or banned.
# Does not apply to unfriending, blocking or leaving a group.
require_threat = true

# {reason} is the finding. The appeal link is always appended.
default_reason = "Flagged by Rotector: {reason}"

# Messages to purge on ban (0-604800).
delete_message_seconds = 0

# Leave group DMs without posting "left the group".
silent_leave = false

# Allow acting on CAUTION findings (Provisional/Mixed).
# Never routine: Rotector asks that these be reviewed by a person, so the UI
# always requires a second, separate confirmation -- ticking the box AND
# typing the action word. Set false to remove the option entirely.
allow_caution = true

# BOT TOKENS ONLY. Try to DM someone before kicking or banning them, so they
# know why and can appeal. Sent first because a banned account shares no server
# with the bot and can no longer be reached. A closed DM is not a failure --
# the action still proceeds.
# Ignored for user tokens: messaging strangers in bulk is what gets a user
# account flagged for spam.
notify_before_action = true

# The notice text. Blank uses the built-in wording.
# {action}, {place} and {reason} are filled in; the appeal link is appended
# if you leave it out.
notify_message = ""

# Seconds between members in a bulk action, and between the notices that
# precede them. Acting fast on many people is what trips Discord's abuse
# heuristics on a user account.
bulk_delay = 1.0
